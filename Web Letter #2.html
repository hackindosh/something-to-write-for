<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>if you can read this? 🐧</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- Sweet, Beautiful Literary Serif Fonts (Romantic, Delicate, Natural Lowercase) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #162132;
      overflow-x: hidden;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed viewport-sized canvas eliminates multi-page browser scroll jank completely */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* Invisible spacer element gives native, butter-smooth browser scrolling for 4,000+ words */
    #scroll-spacer {
      width: 100%;
      pointer-events: none;
    }

    /* Subtle tactile paper grain overlay */
    .paper-grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>

  <div id="scroll-spacer"></div>
  <div class="paper-grain"></div>

  <script>
    // ============================================================================
    // 1. REPLACE YOUR TEXT HERE!
    // Simply paste or type your own paragraphs (even 4,000+ words with no indentation)
    // inside the backticks (` `) below. Blank lines create paragraph breaks.
    // ============================================================================
    const MY_TEXT = `if you can read this, the snow is falling quietly between the branches.

move your cursor across any sentence on this page and watch each letter gently drift and settle back into place while the eyes above follow your hand.

this entire space is yours — just open index.html, replace the text inside MY_TEXT at the very top of the script with your own words, and publish it directly to your github repository.

(double-click anywhere on the page to switch between gentle drift, harmonic float, and subtle eddy physics.)`;

    // ============================================================================
    // 2. TYPOGRAPHY & PHYSICS SETTINGS
    // ============================================================================
    const CONFIG = {
      fontFamily: 'Cormorant Garamond', // Sweet, delicate literary serif (supports true lowercase)
      fontWeight: 600,                  // Graceful, legible weight
      repelRadius: 120,                 // How far the cursor reaches
      repelStrength: 2.1,               // Gentle, refined reaction to the cursor
      springStiffness: 0.075,           // Smooth, organic return to resting position
      damping: 0.84,                    // Fluid, unhurried damping
      snowflakeCount: 115               // Continuous, non-repetitive falling snow
    };

    // ============================================================================
    // P5.JS VIEWPORT-LOCKED ENGINE (60FPS EVEN WITH 4,000+ WORDS)
    // ============================================================================
    let lines = [];                 // Indexed by line number for O(1) instant scroll lookup
    let lineHeight = 34;
    let kineticMode = 0;            // 0 = Gentle Drift, 1 = Harmonic Float, 2 = Subtle Eddy
    let snowflakes = [];            // Non-repetitive Perlin-drifting Snowflake instances
    let treeSeed = 1;               // Organic seed for natural branch asymmetries

    // ----------------------------------------------------------------------------
    // CLASS: Non-Repetitive Snowflake (inspired by p5.js Classes & Objects: Snowflakes)
    // Uses unique Perlin noise seeds, individual wind curves, and randomized rebirth
    // so the snowfall never repeats a pattern.
    // ----------------------------------------------------------------------------
    class Snowflake {
      constructor(spawnRandomY = false) {
        this.reset(spawnRandomY);
      }

      reset(spawnRandomY = false) {
        this.x = random(-40, width + 40);
        this.y = spawnRandomY ? random(-height, height) : random(-80, -10);
        this.size = pow(random(), 1.8) * 5.2 + 1.8; // Mostly delicate small flakes, occasional soft larger ones
        this.fallSpeed = map(this.size, 1.8, 7.0, 0.45, 1.55) * random(0.85, 1.2);
        this.noiseSeedX = random(10000);
        this.noiseSeedSpin = random(10000);
        this.swayAmp = random(0.35, 1.35);
        this.alpha = map(this.size, 1.8, 7.0, 95, 225);
        this.tintHue = random([0, 1, 2]); // Subtle pearl, blush-snow, or ice-mist tint
      }

      update(t) {
        // Non-repetitive horizontal drift driven by 2D Perlin noise + gentle cursor breeze
        const wind = (noise(this.noiseSeedX, t * 0.18) - 0.48) * 2.4 * this.swayAmp;
        const mouseBreeze = constrain((mouseX - pmouseX) * 0.012, -0.8, 0.8) * (this.size / 6);

        this.x += wind + mouseBreeze;
        this.y += this.fallSpeed + noise(this.noiseSeedSpin, t * 0.25) * 0.35;

        // Re-seed with fresh random attributes whenever a flake exits the viewport
        if (this.y > height + 20) {
          this.reset(false);
        }
        if (this.x < -60) this.x = width + 50;
        if (this.x > width + 60) this.x = -50;
      }

      display(ctx) {
        if (this.tintHue === 0) {
          ctx.fillStyle = `rgba(255, 252, 248, ${this.alpha / 255})`;
        } else if (this.tintHue === 1) {
          ctx.fillStyle = `rgba(255, 236, 244, ${this.alpha / 255})`;
        } else {
          ctx.fillStyle = `rgba(225, 242, 255, ${this.alpha / 255})`;
        }
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function setup() {
      // Canvas stays strictly viewport-sized (windowWidth x windowHeight) for zero scroll lag
      createCanvas(windowWidth, windowHeight);
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
      textFont(CONFIG.fontFamily);

      treeSeed = floor(random(100000));
      initSnowflakes();
      layoutTextPage();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          layoutTextPage();
        });
      }
    }

    function initSnowflakes() {
      snowflakes = [];
      for (let i = 0; i < CONFIG.snowflakeCount; i++) {
        snowflakes.push(new Snowflake(true));
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      layoutTextPage();
    }

    // Double-click anywhere to refresh tree proportions & cycle text physics
    function doubleClicked() {
      kineticMode = (kineticMode + 1) % 3;
      treeSeed = floor(random(100000));

      const scrollY = window.scrollY;
      const firstLine = Math.max(0, Math.floor((scrollY - 120) / lineHeight));
      const lastLine = Math.min(lines.length - 1, Math.ceil((scrollY + windowHeight + 120) / lineHeight));

      for (let r = firstLine; r <= lastLine; r++) {
        const lineGlyphs = lines[r];
        if (!lineGlyphs) continue;
        for (let i = 0; i < lineGlyphs.length; i++) {
          lineGlyphs[i].vy -= random(1.2, 3.0);
          lineGlyphs[i].vx += random(-1.4, 1.4);
        }
      }
    }

    // ----------------------------------------------------------------------------
    // BACKGROUND LAYER: p5.js "Repetition: Recursive Tree"
    // Renders a graceful, interactive recursive tree rooted at the bottom of the
    // viewport behind the text, reacting softly to cursor position.
    // ----------------------------------------------------------------------------
    function drawRecursiveTreeBackground() {
      const ctx = drawingContext;

      // Deep twilight-slate sky gradient so both branches, snow, and sweet serif text shine
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#162235');
      grad.addColorStop(0.55, '#1e2f47');
      grad.addColorStop(1, '#263954');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Soft moonlit aura behind the tree crown
      const glow = ctx.createRadialGradient(width * 0.5, height * 0.56, 20, width * 0.5, height * 0.56, Math.max(width, height) * 0.55);
      glow.addColorStop(0, 'rgba(246, 224, 232, 0.08)');
      glow.addColorStop(1, 'rgba(22, 34, 53, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      // Interactive branch angle inspired by p5.js Repetition: Recursive Tree
      const normalizedMouse = constrain(mouseX / Math.max(1, width), 0, 1);
      const gentleBreath = Math.sin(frameCount * 0.012) * 0.035;
      const baseTheta = (normalizedMouse * 0.62 + 0.24) + gentleBreath;

      const trunkLen = constrain(min(width, height) * 0.23, 95, 195);

      ctx.save();
      ctx.translate(width * 0.5, height);
      ctx.lineCap = 'round';

      // Draw trunk
      ctx.strokeStyle = 'rgba(198, 214, 234, 0.24)';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -trunkLen);
      ctx.stroke();

      ctx.translate(0, -trunkLen);
      drawBranch(ctx, trunkLen, baseTheta, 0);
      ctx.restore();
    }

    function drawBranch(ctx, h, theta, depth) {
      const nextH = h * 0.68;
      if (nextH < 5 || depth > 8) return;

      // Subtle blossom-tipped tone at the outer twigs, misty silver-blue on inner limbs
      const isTwig = nextH < 13;
      ctx.strokeStyle = isTwig
        ? 'rgba(255, 222, 235, 0.34)'
        : `rgba(198, 214, 234, ${Math.max(0.12, 0.24 - depth * 0.014)})`;
      ctx.lineWidth = Math.max(0.75, 3.6 - depth * 0.38);

      // Right branch
      ctx.save();
      ctx.rotate(theta);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -nextH);
      ctx.stroke();
      ctx.translate(0, -nextH);
      drawBranch(ctx, nextH, theta, depth + 1);
      ctx.restore();

      // Left branch
      ctx.save();
      ctx.rotate(-theta);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -nextH);
      ctx.stroke();
      ctx.translate(0, -nextH);
      drawBranch(ctx, nextH, theta, depth + 1);
      ctx.restore();
    }

    // Parses MY_TEXT (even 4,000+ words with no indentation) into line-indexed character nodes
    function layoutTextPage() {
      lines = [];

      const vw = windowWidth;
      const vh = windowHeight;

      // Balanced centered literary column for effortless reading
      const marginX = constrain(vw * 0.16, 28, 280);
      const maxLineWidth = Math.max(240, min(vw - marginX * 2, 720));

      let baseSize = constrain(vw * 0.021, 20, 26);
      if (MY_TEXT.length < 220) baseSize = constrain(vw * 0.029, 23, 34);

      lineHeight = baseSize * 1.62;

      const ctx = drawingContext;
      ctx.font = `${CONFIG.fontWeight} ${baseSize}px "${CONFIG.fontFamily}", "Playfair Display", Georgia, serif`;

      // Pre-measure character widths in a cache map so laying out 4,000+ words takes < 15ms
      const charWidthCache = new Map();
      const getCharWidth = (ch) => {
        let w = charWidthCache.get(ch);
        if (w === undefined) {
          w = ctx.measureText(ch).width;
          charWidthCache.set(ch, w);
        }
        return w;
      };
      const spaceWidth = getCharWidth(' ');

      // Split into paragraphs (handles unindented text blocks cleanly)
      const rawParagraphs = MY_TEXT.replace(/\r\n/g, '\n').split('\n');
      let wrappedLines = [];

      for (let pIndex = 0; pIndex < rawParagraphs.length; pIndex++) {
        const para = rawParagraphs[pIndex].trim();

        if (para === '') {
          wrappedLines.push('');
          continue;
        }

        const words = para.split(/\s+/);
        let currentLine = '';
        let currentWidth = 0;

        for (let w = 0; w < words.length; w++) {
          const word = words[w];
          let wordWidth = 0;
          for (let c = 0; c < word.length; c++) {
            wordWidth += getCharWidth(word[c]);
          }

          if (currentLine === '') {
            currentLine = word;
            currentWidth = wordWidth;
          } else if (currentWidth + spaceWidth + wordWidth <= maxLineWidth) {
            currentLine += ' ' + word;
            currentWidth += spaceWidth + wordWidth;
          } else {
            wrappedLines.push(currentLine);
            currentLine = word;
            currentWidth = wordWidth;
          }
        }

        if (currentLine !== '') {
          wrappedLines.push(currentLine);
        }
      }

      // Compute total document height & leave generous top space so text sits cleanly below the top-center Aim eyes
      const totalTextHeight = wrappedLines.length * lineHeight;
      const topPadding = constrain(min(vw, vh) * 0.25, 145, 220);
      const bottomPadding = constrain(vh * 0.18, 90, 180);

      const startY = (totalTextHeight + topPadding + bottomPadding <= vh)
        ? Math.max(topPadding, (vh - totalTextHeight) * 0.52 + baseSize * 0.8)
        : topPadding + baseSize * 0.8;

      const totalPageHeight = Math.max(vh, startY + totalTextHeight + bottomPadding);
      const spacer = document.getElementById('scroll-spacer');
      if (spacer) {
        spacer.style.height = `${Math.ceil(totalPageHeight)}px`;
      }

      const columnLeft = (vw - maxLineWidth) * 0.5;

      // Build line-indexed glyph arrays for instant O(1) viewport slicing during scroll
      for (let r = 0; r < wrappedLines.length; r++) {
        const str = wrappedLines[r];
        const lineY = startY + r * lineHeight;
        const rowGlyphs = [];

        if (str !== '') {
          let cursorX = columnLeft;
          for (let c = 0; c < str.length; c++) {
            const ch = str[c];
            const cw = getCharWidth(ch);

            if (ch !== ' ') {
              rowGlyphs.push({
                char: ch,
                ox: cursorX,
                oy: lineY,
                x: cursorX,
                y: lineY,
                vx: 0,
                vy: 0,
                angle: 0,
                vAngle: 0,
                size: baseSize,
                active: false
              });
            }

            cursorX += cw;
          }
        }

        lines.push(rowGlyphs);
      }
    }

    function draw() {
      // 1. BACKGROUND LAYER: p5.js "Repetition: Recursive Tree"
      drawRecursiveTreeBackground();

      // 2. CONTINUOUS SNOWFALL LAYER (behind text): Non-repetitive Snowflakes
      const t = frameCount * 0.02;
      const ctx = drawingContext;
      for (let i = 0; i < snowflakes.length; i++) {
        snowflakes[i].update(t);
        if (i % 2 === 0) {
          snowflakes[i].display(ctx);
        }
      }

      // 3. FOREGROUND TEXT LAYER: Render only the visible lines in the current scroll window
      renderKineticBodyText();

      // 4. FOREGROUND SNOWFLAKES (subtle depth flakes drifting gently in front)
      for (let i = 1; i < snowflakes.length; i += 2) {
        snowflakes[i].display(ctx);
      }

      // 5. TOP-CENTER TRACKING ELEMENT: p5.js "Angles and Motion: Aim"
      drawTopCenterAimElement();
    }

    // ----------------------------------------------------------------------------
    // TOP-CENTER TRACKING ELEMENT: p5.js "Angles and Motion: Aim"
    // Two centered eyes at the top of the page that smoothly track the cursor
    // across the entire viewport, styled harmoniously with the page palette.
    // ----------------------------------------------------------------------------
    function drawTopCenterAimElement() {
      push();
      angleMode(RADIANS);

      const scaleFactor = constrain(min(width, height) / 860, 0.62, 1.0);
      const centerX = width * 0.5;
      const centerY = 66 * scaleFactor;
      const eyeOffset = 34 * scaleFactor;
      const eyeRadius = 23 * scaleFactor;
      const pupilRadius = 9.5 * scaleFactor;
      const maxPupilTravel = eyeRadius - pupilRadius - 3 * scaleFactor;

      const eyes = [centerX - eyeOffset, centerX + eyeOffset];

      for (let i = 0; i < eyes.length; i++) {
        const ex = eyes[i];
        const ey = centerY;

        // Angle from this eye's center toward the cursor (exact Aim mechanic)
        const angle = atan2(mouseY - ey, mouseX - ex);
        const distToCursor = dist(mouseX, mouseY, ex, ey);
        const travel = min(maxPupilTravel, distToCursor * 0.18);

        // Soft outer halo
        noStroke();
        fill(255, 244, 248, 28);
        circle(ex, ey, (eyeRadius + 5 * scaleFactor) * 2);

        // Eye sclera
        fill(255, 251, 248, 242);
        stroke(26, 39, 62, 220);
        strokeWeight(2.2 * scaleFactor);
        circle(ex, ey, eyeRadius * 2);

        // Aiming iris / pupil oriented along atan2(mouseY - ey, mouseX - ex)
        push();
        translate(ex, ey);
        rotate(angle);

        // Warm rose-indigo iris
        noStroke();
        fill(48, 66, 98);
        circle(travel, 0, pupilRadius * 2.15);

        // Deep pupil
        fill(18, 26, 42);
        circle(travel + 1.2 * scaleFactor, 0, pupilRadius * 1.25);

        // Tiny sweet catchlight sparkle
        fill(255, 252, 250, 235);
        circle(travel - 1.5 * scaleFactor, -2.5 * scaleFactor, 3.2 * scaleFactor);
        pop();
      }

      pop();
    }

    // ----------------------------------------------------------------------------
    // KINETIC TYPOGRAPHY ENGINE (O(1) VISIBLE-LINE SLICE FOR ZERO SCROLL JANK)
    // Only processes the ~25 lines currently in view, keeping 4,000+ words at 60fps.
    // ----------------------------------------------------------------------------
    function renderKineticBodyText() {
      if (lines.length === 0) return;

      const scrollY = window.scrollY;
      const firstLineY = lines[0]?.[0]?.oy ?? 180;

      // Compute exact start and end line indices in view (no scanning through 4,000 words!)
      const startRow = Math.max(0, Math.floor((scrollY - firstLineY - 80) / lineHeight));
      const endRow = Math.min(lines.length - 1, Math.ceil((scrollY + height - firstLineY + 80) / lineHeight));

      if (endRow < startRow) return;

      const ctx = drawingContext;
      let baseSize = 22;
      for (let r = startRow; r <= endRow; r++) {
        if (lines[r] && lines[r].length > 0) {
          baseSize = lines[r][0].size;
          break;
        }
      }

      const outlineW = Math.max(2.2, baseSize * 0.11);

      ctx.save();
      ctx.font = `${CONFIG.fontWeight} ${baseSize}px "${CONFIG.fontFamily}", "Playfair Display", Georgia, serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.lineJoin = 'round';
      ctx.lineWidth = outlineW;

      const radius = CONFIG.repelRadius;
      const radiusSq = radius * radius;
      const mouseDocY = mouseY + scrollY;
      const mouseVx = constrain(mouseX - pmouseX, -24, 24);
      const mouseVy = constrain(mouseY - pmouseY, -24, 24);
      const t = frameCount * 0.03;

      for (let r = startRow; r <= endRow; r++) {
        const rowGlyphs = lines[r];
        if (!rowGlyphs || rowGlyphs.length === 0) continue;

        for (let i = 0; i < rowGlyphs.length; i++) {
          const g = rowGlyphs[i];

          const dx = g.x - mouseX;
          const dy = g.y - mouseDocY;
          const distSq = dx * dx + dy * dy;

          // Gentle cursor proximity interaction
          if (distSq < radiusSq && distSq > 0.001) {
            g.active = true;
            const d = Math.sqrt(distSq);
            const falloff = Math.pow(1 - d / radius, 1.8);

            if (kineticMode === 0) {
              // Mode 0: Gentle Drift + Soft Wake
              const pushAngle = Math.atan2(dy, dx);
              g.vx += Math.cos(pushAngle) * falloff * CONFIG.repelStrength + mouseVx * falloff * 0.12;
              g.vy += Math.sin(pushAngle) * falloff * CONFIG.repelStrength + mouseVy * falloff * 0.12;
              g.vAngle += (mouseVx * 0.0025 - g.angle * 0.1) * falloff;
            } else if (kineticMode === 1) {
              // Mode 1: Harmonic Float (letters breathe and lift softly like ripples on water)
              const waveLift = Math.sin(d * 0.07 - t * 2.2) * 6.5 * falloff;
              g.vy += waveLift * 0.2 + mouseVy * falloff * 0.08;
              g.vx += Math.cos(d * 0.05 - t) * 1.6 * falloff;
              g.vAngle += Math.sin(t + i * 0.2) * 0.015 * falloff;
            } else {
              // Mode 2: Subtle Eddy
              const swirlAngle = Math.atan2(dy, dx) + Math.PI * 0.5;
              g.vx += Math.cos(swirlAngle) * falloff * 4.2;
              g.vy += Math.sin(swirlAngle) * falloff * 4.2;
              g.vAngle += 0.022 * falloff;
            }
          }

          // Only integrate spring physics for letters currently displaced from rest
          if (g.active) {
            g.vx += (g.ox - g.x) * CONFIG.springStiffness;
            g.vy += (g.oy - g.y) * CONFIG.springStiffness;
            g.vAngle += (0 - g.angle) * CONFIG.springStiffness * 1.2;

            g.vx *= CONFIG.damping;
            g.vy *= CONFIG.damping;
            g.vAngle *= CONFIG.damping;

            g.x += g.vx;
            g.y += g.vy;
            g.angle += g.vAngle;

            if (
              Math.abs(g.x - g.ox) < 0.06 &&
              Math.abs(g.y - g.oy) < 0.06 &&
              Math.abs(g.vx) < 0.03 &&
              Math.abs(g.vy) < 0.03 &&
              Math.abs(g.angle) < 0.004
            ) {
              g.x = g.ox;
              g.y = g.oy;
              g.vx = 0;
              g.vy = 0;
              g.angle = 0;
              g.vAngle = 0;
              g.active = false;
            }
          }

          // Translate document Y into fixed viewport Y
          const screenX = g.x;
          const screenY = g.y - scrollY;
          const displacement = g.active ? (Math.abs(g.x - g.ox) + Math.abs(g.y - g.oy)) : 0;

          const needsRotate = g.active && Math.abs(g.angle) > 0.004;
          if (needsRotate) {
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(g.angle);
          }

          const drawX = needsRotate ? 0 : screenX;
          const drawY = needsRotate ? 0 : screenY;

          // Soft twilight-navy contour + warm cream-blush fill for sweet readability
          ctx.fillStyle = 'rgba(13, 21, 36, 0.72)';
          ctx.fillText(g.char, drawX + 1.2, drawY + 1.5);

          ctx.strokeStyle = 'rgba(15, 24, 42, 0.85)';
          ctx.strokeText(g.char, drawX, drawY);

          ctx.fillStyle = displacement > 3 ? '#ffe8f1' : '#fffaf7';
          ctx.fillText(g.char, drawX, drawY);

          if (needsRotate) {
            ctx.restore();
          }
        }
      }

      ctx.restore();
    }
  </script>
</body>
</html>
